name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - ".github/workflows/precompile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      OTP_VERSION: "25.3"
      ELIXIR_VERSION: "1.14.5"
    steps:
      - uses: actions/checkout@v7

      - name: Install OTP
        uses: cocoa-xu/otp-build@v1
        with:
          otp_version: ${{ env.OTP_VERSION }}

      - name: Install Elixir
        run: |
          otp_release="${OTP_VERSION%%.*}"
          elixir_dir="$GITHUB_WORKSPACE/.elixir"
          curl -fSL --retry 3 --retry-all-errors "https://github.com/elixir-lang/elixir/releases/download/v${ELIXIR_VERSION}/elixir-otp-${otp_release}.zip" -o "$RUNNER_TEMP/elixir.zip"
          mkdir -p "$elixir_dir"
          unzip -q "$RUNNER_TEMP/elixir.zip" -d "$elixir_dir"

      - name: Start Linux container
        run: |
          docker run --rm --detach --name expty-linux \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env MIX_ENV \
            --env ERL_ROOTDIR=/workspace/.otp/usr/local/lib/erlang \
            --env PATH=/workspace/.otp/usr/local/bin:/workspace/.elixir/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ubuntu:20.04 sleep infinity
          docker exec --env DEBIAN_FRONTEND=noninteractive expty-linux \
            bash -c "apt-get update && apt-get install -y build-essential ca-certificates cmake git libtinfo5 ninja-build pkg-config"

      - name: Install dependencies
        run: |
          docker exec expty-linux mix local.hex --force
          docker exec expty-linux mix local.rebar --force
          docker exec expty-linux mix deps.get

      - name: Compile
        run: docker exec expty-linux mix compile

      - name: Test
        run: docker exec expty-linux mix test --no-compile

      - name: Stop Linux container
        if: always()
        run: docker stop expty-linux

  windows:
    runs-on: windows-2022
    env:
      MIX_ENV: test
      OTP_VERSION: "25"
      ELIXIR_VERSION: "1.14"
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        shell: bash
        run: mix deps.get

      - name: Compile
        shell: bash
        run: mix compile

      - name: Test
        shell: bash
        run: mix test --no-compile

  macos:
    runs-on: macos-15-intel
    env:
      MIX_ENV: test
      OTP_VERSION: "26.2.1"
      ELIXIR_VERSION: "1.16.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install OTP
        uses: cocoa-xu/otp-build@v1
        with:
          otp_version: ${{ env.OTP_VERSION }}

      - name: Install Elixir
        run: |
          otp_release="${OTP_VERSION%%.*}"
          elixir_dir="$RUNNER_TEMP/elixir"
          curl -fSL --retry 3 --retry-all-errors "https://github.com/elixir-lang/elixir/releases/download/v${ELIXIR_VERSION}/elixir-otp-${otp_release}.zip" -o "$RUNNER_TEMP/elixir.zip"
          mkdir -p "$elixir_dir"
          unzip -q "$RUNNER_TEMP/elixir.zip" -d "$elixir_dir"
          echo "$elixir_dir/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile
        run: mix compile

      - name: Test
        run: mix test --no-compile
